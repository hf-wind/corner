name: corner

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corner}
      POSTGRES_USER: ${POSTGRES_USER:-corner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corner} -d ${POSTGRES_DB:-corner}"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?REDIS_PASS is required}", "--appendonly", "yes"]
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://${POSTGRES_USER:-corner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-corner}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corner}
      DB_USER: ${POSTGRES_USER:-corner}
      DB_PASS: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASS}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-huifeng}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-1833079849@qq.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SEED_ALLOWED_DATABASE: ${POSTGRES_DB:-corner}
      SEED_ALLOW_REMOTE_DATABASE: "true"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_INPUT_PRICE_PER_1M: ${AI_INPUT_PRICE_PER_1M:-0}
      AI_OUTPUT_PRICE_PER_1M: ${AI_OUTPUT_PRICE_PER_1M:-0}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      QWEATHER_KEY: ${QWEATHER_KEY:-}
      QWETHER_KEY: ${QWETHER_KEY:-}
      QWEATHER_HOST: ${QWEATHER_HOST:-devapi.qweather.com}
      QWETHER_HOST: ${QWETHER_HOST:-}
      QWEATHER_LOCATION: ${QWEATHER_LOCATION:-101210501}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      FEATURE_ALBUMS_ENABLED: ${FEATURE_ALBUMS_ENABLED:-true}
      FEATURE_MAP_ENABLED: ${FEATURE_MAP_ENABLED:-true}
      FEATURE_PLACES_ENABLED: ${FEATURE_PLACES_ENABLED:-true}
      FEATURE_CONSTELLATION_ENABLED: ${FEATURE_CONSTELLATION_ENABLED:-true}
      FEATURE_STORIES_ENABLED: ${FEATURE_STORIES_ENABLED:-false}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-1833079849@qq.com}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.qq.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-true}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-风隅随笔}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-1833079849@qq.com}
      BACKUP_EMAIL_TO: ${BACKUP_NOTIFICATION_EMAIL_TO:-1833079849@qq.com}
      BACKUP_ARCHIVE_EMAIL_TO: ${BACKUP_ARCHIVE_EMAIL_TO:-huifeng680@gmail.com}
      BACKUP_NOTIFICATION_EMAIL_TO: ${BACKUP_NOTIFICATION_EMAIL_TO:-1833079849@qq.com}
      BACKUP_RECOVERY_TOKEN: ${BACKUP_RECOVERY_TOKEN:-}
      BACKUP_MOUNT_ROOT: /app/backups
      BACKUP_CONTROL_ROOT: /app/backup-control
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:-corner.ink}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
      NODE_ENV: production
      PORT: 4000
    volumes:
      - ${DATA_ROOT:-./data}/uploads:/app/uploads
      - ${BACKUP_ROOT:-./backups}:/app/backups:ro
      - ${DATA_ROOT:-./data}/backup-control:/app/backup-control
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-0x4AAAAAAEBb-aIzkxa6-yRo}
        VITE_TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
        VITE_AMAP_WEB_KEY: ${VITE_AMAP_WEB_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
        VITE_FEATURE_ALBUMS_ENABLED: ${VITE_FEATURE_ALBUMS_ENABLED:-true}
        VITE_FEATURE_MAP_ENABLED: ${VITE_FEATURE_MAP_ENABLED:-true}
        VITE_FEATURE_PLACES_ENABLED: ${VITE_FEATURE_PLACES_ENABLED:-true}
        VITE_FEATURE_CONSTELLATION_ENABLED: ${VITE_FEATURE_CONSTELLATION_ENABLED:-true}
        VITE_FEATURE_STORIES_ENABLED: ${VITE_FEATURE_STORIES_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-./data}/caddy/data:/data
      - ${DATA_ROOT:-./data}/caddy/config:/config
      - ${DATA_ROOT:-./data}/logs/caddy:/var/log/caddy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
