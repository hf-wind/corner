services:
  postgres:
    image: postgres:16-alpine
    container_name: corner-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: corner
      POSTGRES_USER: corner
      POSTGRES_PASSWORD: corner_dev_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: corner-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
