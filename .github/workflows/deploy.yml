name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check runner
        run: |
          whoami
          uname -a
          ls -la ~/.ssh/ 2>&1 || echo ".ssh not exist"

      - name: Test TCP
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          timeout 5 bash -c "echo >/dev/tcp/${SSH_HOST}/22" 2>/dev/null && echo "TCP_OK" || echo "TCP_FAIL"

      - name: SSH and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          APP_PATH: ${{ secrets.APP_PATH }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASS: ${{ secrets.REDIS_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -x
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -i ~/.ssh/deploy_key \
              "${SSH_USER}@${SSH_HOST}" \
              "cd ${APP_PATH} && git pull && docker compose up -d --build" 2>&1 || echo "SSH_EXIT=$?"
