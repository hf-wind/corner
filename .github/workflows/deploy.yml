name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          APP_PATH: ${{ secrets.APP_PATH }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASS: ${{ secrets.REDIS_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -e

          echo "SSH_HOST=$SSH_HOST"
          echo "SSH_USER=$SSH_USER"
          echo "SSH_KEY_len=${#SSH_KEY} chars"
          echo "APP_PATH=$APP_PATH"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          {
            echo 'set -e'
            echo "cd ${APP_PATH}"
            echo 'if [ ! -f .env ]; then'
            echo "  cp .env.example .env"
            echo "  sed -i \"s/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${POSTGRES_PASSWORD}/\" .env"
            echo "  sed -i \"s/REDIS_PASS=.*/REDIS_PASS=${REDIS_PASS}/\" .env"
            echo "  sed -i \"s/JWT_SECRET=.*/JWT_SECRET=${JWT_SECRET}/\" .env"
            echo 'fi'
            echo 'date'
            echo 'git pull'
            echo 'docker compose up -d --build'
          } | ssh -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o LogLevel=ERROR \
                  -i ~/.ssh/deploy_key \
                  "${SSH_USER}@${SSH_HOST}" bash
