name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          APP_PATH: ${{ secrets.APP_PATH }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASS: ${{ secrets.REDIS_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > /tmp/deploy.sh << 'SCRIPT'
set -e
cd __APP_PATH__
if [ ! -f .env ]; then
  cp .env.example .env
  sed -i "s/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=__POSTGRES_PASSWORD__/" .env
  sed -i "s/REDIS_PASS=.*/REDIS_PASS=__REDIS_PASS__/" .env
  sed -i "s/JWT_SECRET=.*/JWT_SECRET=__JWT_SECRET__/" .env
fi
git pull
docker compose up -d --build
SCRIPT
          sed -i "s|__APP_PATH__|${APP_PATH}|g; s|__POSTGRES_PASSWORD__|${POSTGRES_PASSWORD}|g; s|__REDIS_PASS__|${REDIS_PASS}|g; s|__JWT_SECRET__|${JWT_SECRET}|g" /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -i ~/.ssh/deploy_key \
              "${SSH_USER}@${SSH_HOST}" \
              "cd ${APP_PATH} && bash -s" < /tmp/deploy.sh
