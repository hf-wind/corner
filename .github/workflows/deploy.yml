name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run prisma:generate
          npm test -- --runInBand
          npm run build

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH='$APP_PATH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_PATH"
          if [[ -x scripts/backup.sh ]] && docker compose ps --status running postgres | grep -q postgres; then
            ./scripts/backup.sh
          fi
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          docker compose config --quiet
          docker compose build --pull
          docker compose up -d --remove-orphans --wait
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://corner.ink/api/health >/dev/null
          REMOTE
